 for(let i=tracers.length-1;i>=0;i--){const t=tracers[i];t.t-=dt;t.m.material.opacity=Math.max(0,t.t/.15);if(t.t<=0){S.remove(t.m);t.m.geometry.dispose();t.m.material.dispose();tracers.splice(i,1)}}
 // orb
 orb.rotation.y+=dt;orb.position.y=1.2+Math.sin(performance.now()/400)*.15;
 if(!orb.visible){orbT-=dt;if(orbT<=0)orb.visible=true}
 $("prompt").style.display=nearOrb()?"block":"none";
 // enemies
 for(const e of enemies){
  if(!e.alive){e.rt-=dt;if(e.rt<=0){e.alive=true;e.hp=100;e.bar.scale.x=1;e.g.visible=true;e.g.position.copy(e.home);verticalSpeeds.delete(e.g.position);e.cd=1}continue}
  e.bar.quaternion.copy(cam.quaternion);
  const dx=P.pos.x-e.g.position.x,dz=P.pos.z-e.g.position.z,dist=Math.hypot(dx,dz);
  e.m.rotation.y=Math.atan2(dx,dz);e.cd-=dt;
  if(e.type==1){moveCharacter(e.g.position,movement.set(0,0,0),dt);if(dist<2.5&&e.cd<=0){hurt(20);e.cd=1.2}}
  else{e.dt-=dt;if(e.dt<=0){e.dir*=-1;e.dt=1+Math.random()*2}
   const nx=dx/(dist||1),nz=dz/(dist||1);let mx=-nz*e.dir,mz=nx*e.dir;
   if(dist>16){mx+=nx;mz+=nz}else if(dist<9){mx-=nx;mz-=nz}
   moveCharacter(e.g.position,movement.set(mx*3*dt,0,mz*3*dt),dt);
   if(e.cd<=0&&dist<45){e.cd=1.6;const p=new THREE.Mesh(new THREE.SphereGeometry(.15,8,8),new THREE.MeshBasicMaterial({color:0xffaa22}));
    p.position.set(e.g.position.x,e.g.position.y+1.5,e.g.position.z);S.add(p);const v=new THREE.Vector3(P.pos.x-p.position.x,P.pos.y+1.2-p.position.y,P.pos.z-p.position.z).normalize().multiplyScalar(26);eProj.push({m:p,v,life:0})}}}
 for(let i=eProj.length-1;i>=0;i--){const p=eProj[i];movement.copy(p.m.position);p.m.position.addScaledVector(p.v,dt);p.life+=dt;let rm=p.life>3||collisionWorld.intersectsSegment(movement,p.m.position);
  if(!rm&&Math.hypot(p.m.position.x-P.pos.x,p.m.position.z-P.pos.z)<.7&&Math.abs(p.m.position.y-(P.pos.y+1.2))<1.1){hurt(10);rm=true}
  if(rm){S.remove(p.m);eProj.splice(i,1)}}
 hud()}
